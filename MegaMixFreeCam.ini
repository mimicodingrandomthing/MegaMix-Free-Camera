; MegaMix Free Camera keybind configuration
;
; Format:
;   Action=KEY
;   Action=MODIFIER+KEY
;   Action=KEY1,KEY2          ; multiple alternatives
;
; Supported modifier names: CTRL, ALT, SHIFT
; Common key names: A-Z, 0-9, F1-F24, SPACE, HOME, END, INSERT, DELETE,
;                    PGUP, PGDN, UP, DOWN, LEFT, RIGHT, TAB, ENTER, ESC
; Punctuation names: MINUS, PLUS, LBRACKET, RBRACKET, BACKSLASH,
;                    SEMICOLON, APOSTROPHE, COMMA, PERIOD, SLASH, GRAVE
; Numpad names: NUMPAD0-NUMPAD9, NUMPAD_PLUS, NUMPAD_MINUS,
;               NUMPAD_MULTIPLY, NUMPAD_DIVIDE, NUMPAD_DECIMAL
; Mouse buttons can also be used: MOUSE1-MOUSE5
;
; Use NONE to disable an action.
; If this file is edited while the game is running, close and reopen the
; free-camera UI to reload the bindings. The UI labels/buttons will update too.

[Keybinds]
ToggleFreeCam=F8
ToggleMouseLook=F9
ToggleAllLock=ALT+F9
ToggleUI=F10
ResetPose=HOME
GetGameCamera=G
DefaultCamera=H
ApplyUI=ALT+U

MoveForward=W
MoveBackward=S
MoveLeft=A
MoveRight=D
MoveUp=SPACE
MoveDown=CTRL

RollLeft=Q
RollRight=E
LookAtDecrease=LBRACKET
LookAtIncrease=RBRACKET
FovDecrease=R
FovIncrease=F
SensitivityDecrease=MINUS,NUMPAD_MINUS
SensitivityIncrease=PLUS,NUMPAD_PLUS

; These are modifier actions used by movement/roll/FOV/look-at controls.
FastModifier=SHIFT
SlowModifier=ALT

LoadSlot1=1
LoadSlot2=2
LoadSlot3=3
LoadSlot4=4
LoadSlot5=5
LoadSlot6=6
LoadSlot7=7
LoadSlot8=8
LoadSlot9=9

SaveSlot1=ALT+1
SaveSlot2=ALT+2
SaveSlot3=ALT+3
SaveSlot4=ALT+4
SaveSlot5=ALT+5
SaveSlot6=ALT+6
SaveSlot7=ALT+7
SaveSlot8=ALT+8
SaveSlot9=ALT+9
